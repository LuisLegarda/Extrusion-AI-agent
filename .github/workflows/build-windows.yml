name: Build Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Construir ejecutable
        run: |
          pyinstaller --noconfirm --distpath dist --workpath build packaging/extrusion_monitor.spec
          New-Item -ItemType Directory -Force dist/ExtrusionMonitor/data | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: ExtrusionMonitor-windows
          path: dist/ExtrusionMonitor
